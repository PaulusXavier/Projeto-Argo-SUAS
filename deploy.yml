# Gera a versão minificada do Argo SUAS (pasta dist/, ver scripts/build.mjs)
# a cada push na branch principal e publica automaticamente no GitHub
# Pages. Os arquivos-fonte comentados na raiz do repositório continuam
# sendo os únicos que você edita — este workflow cuida sozinho de gerar e
# publicar a versão "enxuta".
#
# Passo único de configuração (uma vez só, feito pela interface do GitHub):
# Settings → Pages → "Build and deployment" → Source: "GitHub Actions"
# (em vez de "Deploy from a branch").
#
# Se a branch principal do seu repositório se chamar "master" em vez de
# "main", troque abaixo.
name: Build e publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Sem package-lock.json ainda commitado, então "npm install" em vez
      # de "npm ci". Depois de rodar uma vez (aqui ou na sua máquina), pode
      # commitar o package-lock.json gerado e trocar para "npm ci", que é
      # mais rápido e mais reprodutível.
      - run: npm install

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
