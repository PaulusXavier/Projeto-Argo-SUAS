<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-label="Constelação de Argo Navis desenhada no mesmo formato de galera usado na Ficha de Encaminhamento Técnico: estrelas ligadas por linhas formando o casco com convés interno e bancos, remos e amarras dos mastros" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
      <defs>
        <!-- Paleta Roraima: amarelo para o casco e o velame, verde para o rio. -->
        <linearGradient id="argoShipBg" gradientUnits="userSpaceOnUse" x1="24" y1="196" x2="272" y2="40">
          <stop offset="0" stop-color="#F2B705"/>
          <stop offset="0.45" stop-color="#FFE066"/>
          <stop offset="1" stop-color="#FFD400"/>
        </linearGradient>
        <linearGradient id="argoRiverBg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="320" y2="0">
          <stop offset="0" stop-color="#17A673" stop-opacity="0"/>
          <stop offset="0.28" stop-color="#4FE0A0"/>
          <stop offset="0.62" stop-color="#1FC98A"/>
          <stop offset="1" stop-color="#17A673" stop-opacity="0"/>
        </linearGradient>
        <filter id="argoStarGlow" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <radialGradient id="argoStarCore" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="45%" stop-color="#FFF7D6"/>
          <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
        </radialGradient>
      </defs>
  <!-- Plano de fundo do Argo SUAS: a mesma constelação-navio do cabeçalho e da
       tela de login (gerada a partir da mesma geometria), aqui em opacidade
       bem baixa para não competir com o texto. As animações abaixo só rodam
       nos navegadores que animam SVG usado como background-image; quando são
       ignoradas, o desenho aparece parado, sem quebrar nada. -->
  <style>
    .const-line { fill: none; stroke: url(#argoShipBg); stroke-width: 1.6; stroke-opacity: 0.11;
                  stroke-linecap: round; stroke-linejoin: round; }
    .const-meteor { opacity: 0; }
    .const-meteor-tail { fill: none; stroke: #FFE066; stroke-width: 1.1; stroke-opacity: 0.35;
                         stroke-linecap: round; }
    .const-meteor-head { fill: #FFE066; fill-opacity: 0.35; }
    .const-wave { fill: none; stroke: url(#argoRiverBg); stroke-width: 2.4; stroke-opacity: 0.09;
                  stroke-linecap: round; stroke-linejoin: round; }
    .const-sea path:nth-child(2) { stroke-opacity: 0.11; stroke-width: 3; }
    .const-sea path:nth-child(3) { stroke-opacity: 0.05; stroke-width: 1.5;
                  animation-duration: 23s, 13s; animation-delay: -4s, -2s; }

    /* Remos: linhas do casco até a água, girando em torno do ponto onde
       encostam no casco (transform-origin em coordenadas absolutas do
       viewBox). Bombordo e boreste giram em espelho, e cada remo tem um
       pequeno atraso para simular a onda de uma remada em conjunto. */
    .const-oar { fill: none; stroke: url(#argoShipBg); stroke-width: 2; stroke-opacity: 0.16;
                 stroke-linecap: round; }
    .const-oar-l { animation: rowLeft 3.2s ease-in-out infinite; }
    .const-oar-r { animation: rowRight 3.2s ease-in-out infinite; }
    @keyframes rowLeft {
      0%   { transform: rotate(-16deg); }
      50%  { transform: rotate(20deg); }
      100% { transform: rotate(-16deg); }
    }
    @keyframes rowRight {
      0%   { transform: rotate(16deg); }
      50%  { transform: rotate(-20deg); }
      100% { transform: rotate(16deg); }
    }

    /* Estrelas da constelação, nos vértices onde as linhas do barco se
       encontram — brilham com um leve glow e cada uma pisca no seu próprio
       ritmo. */
    .const-star { fill: url(#argoStarCore); filter: url(#argoStarGlow);
                  transform-box: fill-box; transform-origin: center; transform: scale(1.3); }
    .const-star-tw { animation: twinkle 4.6s ease-in-out infinite; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 1; }
    }

    /* Mesmas camadas de tempo do app (11s, 17s, 12s, 5,5s, 19s): como nenhuma
       é múltipla da outra, o conjunto quase nunca se repete igual. */
    .const-ship { transform-box: fill-box; transform-origin: 50% 85%;
                  animation: sail 11s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
    @keyframes sail {
      0%   { transform: translateY(0)      rotate(-0.85deg); }
      25%  { transform: translateY(-2.1px) rotate(0.15deg); }
      50%  { transform: translateY(-3.4px) rotate(0.95deg); }
      75%  { transform: translateY(-1.3px) rotate(0.1deg); }
      100% { transform: translateY(0)      rotate(-0.85deg); }
    }
    .const-ship .const-sway {
      transform-box: fill-box; animation: sway 17s ease-in-out infinite; }
    @keyframes sway {
      0%, 100% { transform: translateX(-1.6px); }
      50%      { transform: translateX(1.6px); }
    }
    .const-wave { transform-box: fill-box;
                  animation: flow 12s ease-in-out infinite, bob 6.5s ease-in-out infinite; }
    .const-sea path:nth-child(2) { animation-name: flowFar, bob;
                                   animation-duration: 17s, 9s;
                                   animation-direction: reverse, alternate-reverse; }
    .const-sea path:nth-child(3) { animation-name: flowFar, bob; }
    @keyframes flow {
      0%, 100% { transform: translateX(-5px); }
      50%      { transform: translateX(5px); }
    }
    @keyframes flowFar {
      0%, 100% { transform: translateX(4px); }
      50%      { transform: translateX(-4px); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-1.6px); }
    }
    .const-meteor { animation: meteor 19s linear infinite; }
    @keyframes meteor {
      0%   { opacity: 0;   transform: translate(248px, 12px) scale(0.85); }
      1.5% { opacity: 0.6; }
      6%   { opacity: 0.4; }
      8%   { opacity: 0;   transform: translate(96px, 98px) scale(1.05); }
      100% { opacity: 0;   transform: translate(96px, 98px) scale(1.05); }
    }
    @media (prefers-reduced-motion: reduce) {
      .const-ship, .const-wave, .const-ship .const-sway { animation: none; }
      .const-meteor { animation: none; display: none; }
      .const-oar-l, .const-oar-r { animation: none; }
      .const-star-tw { animation: none; opacity: 0.85; }
    }
  </style>
      <g class="const-sky">
        <g class="const-meteor">
          <line class="const-meteor-tail" x1="0" y1="0" x2="23" y2="-12"/>
          <circle class="const-meteor-head" cx="0" cy="0" r="1.5"/>
        </g>
      </g>
      <g class="const-ship">
        <g class="const-sway">
          <g class="const-lines">
            <!-- Casco: mesmo perfil curvo usado na marca d'água da Ficha de
                 Encaminhamento Técnico (buildPrintWatermark, em app.js) -->
            <path class="const-line" d="M42,86 C58,132 100,178 152,190 C165,193 175,193 168,193 C205,193 250,150 278,86"/>
            <!-- Amarras/mastros curvos, um de cada lado -->
            <path class="const-line" d="M42,86 C36,72 34,58 40,44"/>
            <path class="const-line" d="M55,74 C51,60 51,48 58,36"/>
            <path class="const-line" d="M278,86 C284,72 286,58 280,44"/>
            <path class="const-line" d="M265,74 C269,60 269,48 262,36"/>
            <!-- Mastro central -->
            <line class="const-line" x1="160" y1="18" x2="160" y2="6"/>
            <line class="const-line" x1="136" y1="28" x2="126" y2="18"/>
            <line class="const-line" x1="184" y1="28" x2="194" y2="18"/>
            <!-- Convés interno: segunda linha de casco, mais curta, sugerindo
                 a borda por dentro -->
            <path class="const-line" d="M60,90 C74,120 108,150 152,160 C161,162 169,162 165,162 C193,162 226,132 260,90"/>
            <!-- Bancos dos remadores, à altura de cada par de remos -->
            <path class="const-line" d="M56,112 Q160,120 264,112"/>
            <path class="const-line" d="M104,170 Q160,177 216,170"/>
          </g>
          <g class="const-stars">
            <!-- Proa, popa e quilha -->
            <circle class="const-star const-star-tw" style="animation-delay:0s;"    cx="42"  cy="86"  r="1.9"/>
            <circle class="const-star const-star-tw" style="animation-delay:-2.1s;" cx="278" cy="86"  r="1.9"/>
            <circle class="const-star const-star-tw" style="animation-delay:-1.3s;" cx="152" cy="190" r="1.5"/>
            <circle class="const-star const-star-tw" style="animation-delay:-3.4s;" cx="168" cy="193" r="1.5"/>
            <!-- Topo do mastro e amarras -->
            <circle class="const-star const-star-tw" style="animation-delay:-0.6s;" cx="160" cy="6"   r="1.7"/>
            <circle class="const-star const-star-tw" style="animation-delay:-2.8s;" cx="40"  cy="44"  r="1.3"/>
            <circle class="const-star const-star-tw" style="animation-delay:-1.8s;" cx="280" cy="44"  r="1.3"/>
            <!-- Convés interno -->
            <circle class="const-star const-star-tw" style="animation-delay:-3.9s;" cx="152" cy="160" r="1.2"/>
            <circle class="const-star const-star-tw" style="animation-delay:-0.9s;" cx="165" cy="162" r="1.2"/>
            <!-- Onde os remos encostam no casco -->
            <circle class="const-star const-star-tw" style="animation-delay:-2.5s;" cx="58"  cy="108" r="1.4"/>
            <circle class="const-star const-star-tw" style="animation-delay:-1.1s;" cx="110" cy="168" r="1.4"/>
            <circle class="const-star const-star-tw" style="animation-delay:-3.2s;" cx="262" cy="108" r="1.4"/>
            <circle class="const-star const-star-tw" style="animation-delay:-0.3s;" cx="210" cy="168" r="1.4"/>
          </g>
          <g class="const-oars">
            <!-- Remos de bombordo, encostados no casco e remando em conjunto -->
            <line class="const-oar const-oar-l" style="transform-origin:58px 108px; animation-delay:0s;"     x1="58"  y1="108" x2="22"  y2="130"/>
            <line class="const-oar const-oar-l" style="transform-origin:110px 168px; animation-delay:-0.5s;" x1="110" y1="168" x2="78"  y2="192"/>
            <!-- Remos de boreste, espelhados -->
            <line class="const-oar const-oar-r" style="transform-origin:262px 108px; animation-delay:0s;"     x1="262" y1="108" x2="298" y2="130"/>
            <line class="const-oar const-oar-r" style="transform-origin:210px 168px; animation-delay:-0.5s;" x1="210" y1="168" x2="242" y2="192"/>
          </g>
        </g>
      </g>
      <g class="const-sea">
        <path class="const-wave" d="M 2 208 q 18 -7 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0"/>
        <path class="const-wave" d="M 2 221 q 18 -6 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0"/>
        <path class="const-wave" d="M 2 197 q 18 -5 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0"/>
      </g>
</svg>
