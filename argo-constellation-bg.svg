<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img" aria-label="Constelação de Argo Navis desenhada como um navio: casco, mastro, velas e a estrela-guia Canopus na proa" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Plano de fundo do Argo SUAS: a mesma constelação-navio do cabeçalho e da
       tela de login (gerada a partir da mesma geometria), aqui em opacidade
       bem baixa para não competir com o texto. As animações abaixo só rodam
       nos navegadores que animam SVG usado como background-image; quando são
       ignoradas, o desenho aparece parado, sem quebrar nada. -->
  <style>
    .const-line { fill: none; stroke: #0091C2; stroke-width: 1.4; stroke-opacity: 0.13;
                  stroke-dasharray: 3 4; stroke-linecap: round; }
    .const-star { fill: #0091C2; fill-opacity: 0.16; }
    .const-sky .const-star { fill-opacity: 0.1; }
    .guide-star { fill: #E8AC3D; fill-opacity: 0.2; }
    .guide-star-glow { fill: #E8AC3D; fill-opacity: 0.06; }
    .const-wave { fill: none; stroke: #0091C2; stroke-width: 1.3; stroke-opacity: 0.1;
                  stroke-dasharray: 5 6; stroke-linecap: round; }
    .const-ship { transform-box: fill-box; transform-origin: 50% 85%;
                  animation: sail 9s ease-in-out infinite; }
    @keyframes sail {
      0%, 100% { transform: translateY(0) rotate(-0.7deg); }
      50%       { transform: translateY(-3px) rotate(0.7deg); }
    }
    .const-wave { animation: drift 12s linear infinite; }
    @keyframes drift { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -44; } }
    @media (prefers-reduced-motion: reduce) {
      .const-ship, .const-wave { animation: none; }
    }
  </style>
      <g class="const-sky">
        <circle class="const-star" cx="66" cy="34" r="1.5"/>
        <circle class="const-star" cx="104" cy="58" r="1.1"/>
        <circle class="const-star" cx="238" cy="40" r="1.6"/>
        <circle class="const-star" cx="278" cy="76" r="1.3"/>
        <circle class="const-star" cx="296" cy="122" r="1.1"/>
        <circle class="const-star" cx="20" cy="68" r="1.4"/>
        <circle class="const-star" cx="288" cy="196" r="1.2"/>
        <circle class="const-star" cx="58" cy="206" r="1.1"/>
        <circle class="const-star" cx="112" cy="22" r="1.4"/>
      </g>
      <g class="const-ship">
        <g class="const-lines">
          <line class="const-line" x1="36" y1="146" x2="52" y2="167"/>
          <line class="const-line" x1="52" y1="167" x2="84" y2="181"/>
          <line class="const-line" x1="84" y1="181" x2="128" y2="188"/>
          <line class="const-line" x1="128" y1="188" x2="174" y2="186"/>
          <line class="const-line" x1="174" y1="186" x2="216" y2="174"/>
          <line class="const-line" x1="216" y1="174" x2="250" y2="154"/>
          <line class="const-line" x1="36" y1="146" x2="250" y2="154"/>
          <line class="const-line" x1="150" y1="150.3" x2="150" y2="48"/>
          <line class="const-line" x1="112" y1="92" x2="192" y2="96"/>
          <line class="const-line" x1="150" y1="48" x2="36" y2="146"/>
          <line class="const-line" x1="150" y1="48" x2="250" y2="154"/>
          <line class="const-line" x1="150" y1="48" x2="178" y2="39"/>
          <line class="const-line" x1="36" y1="146" x2="21" y2="126"/>
        </g>
        <g class="const-stars">
          <circle class="const-star guide-star-glow" cx="36" cy="146" r="13"/>
          <circle class="const-star guide-star" cx="36" cy="146" r="3.9"/>
          <circle class="const-star" cx="150" cy="48" r="2.5"/>
          <circle class="const-star" cx="178" cy="39" r="1.2"/>
          <circle class="const-star" cx="112" cy="92" r="1.7"/>
          <circle class="const-star" cx="192" cy="96" r="1.7"/>
          <circle class="const-star" cx="150" cy="150.3" r="1.9"/>
          <circle class="const-star" cx="21" cy="126" r="1.5"/>
          <circle class="const-star" cx="250" cy="154" r="2.4"/>
          <circle class="const-star" cx="52" cy="167" r="1.9"/>
          <circle class="const-star" cx="84" cy="181" r="2.1"/>
          <circle class="const-star" cx="128" cy="188" r="2.2"/>
          <circle class="const-star" cx="174" cy="186" r="2.1"/>
          <circle class="const-star" cx="216" cy="174" r="1.9"/>
          <circle class="const-star" cx="96" cy="148.2" r="1.8"/>
          <circle class="const-star" cx="150" cy="150.3" r="1.6"/>
          <circle class="const-star" cx="204" cy="152.3" r="1.8"/>
        </g>
      </g>
      <g class="const-sea">
        <path class="const-wave" d="M 2 204 q 18 -7 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0"/>
        <path class="const-wave" d="M 2 218 q 18 -6 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0"/>
      </g>
</svg>
